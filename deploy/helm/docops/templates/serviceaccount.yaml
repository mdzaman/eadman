{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "docops.serviceAccountName" . }}
  labels:
    {{- include "docops.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The pods never call the Kubernetes API, so no API token is mounted.
automountServiceAccountToken: false
{{- end }}
