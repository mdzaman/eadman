{{- /*
Only when you do not bring your own Secret (secrets.existingSecret). It generates what every API replica
must share, once, and keeps it on upgrade by reading the Secret back with `lookup`:
  - DOCOPS_TOKEN_SIGNING_SECRET and DOCOPS_PREVIEW_SECRET: random strings;
  - DOCOPS_SIGNING_KEY_PEM: an Ed25519 private key (Sprig's genPrivateKey writes PKCS#8 PEM, which the
    API's createPrivateKey accepts). A replica only verifies signatures made with its own key, so
    without a shared key a build finalized on one replica cannot be promoted by another.
`lookup` finds nothing under `helm template` or an offline GitOps render, where new values would be
generated on every render: use secrets.existingSecret in those setups.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "docops.fullname" . }}
{{- $old := dict }}
{{- $found := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $found }}
{{- $old = $found.data | default dict }}
{{- end }}
{{- $signingKey := index $old "DOCOPS_SIGNING_KEY_PEM" }}
{{- if not $signingKey }}
{{- $signingKey = genPrivateKey "ed25519" | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "docops.labels" . | nindent 4 }}
type: Opaque
data:
  DOCOPS_TOKEN_SIGNING_SECRET: {{ index $old "DOCOPS_TOKEN_SIGNING_SECRET" | default (randAlphaNum 48 | b64enc) | quote }}
  DOCOPS_PREVIEW_SECRET: {{ index $old "DOCOPS_PREVIEW_SECRET" | default (randAlphaNum 48 | b64enc) | quote }}
  DOCOPS_SIGNING_KEY_PEM: {{ $signingKey | quote }}
{{- with .Values.secrets.values }}
stringData:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
{{- end }}
